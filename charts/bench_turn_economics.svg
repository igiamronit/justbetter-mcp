<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 336" width="820" height="336" role="img">
<style>.bg { fill: #ffffff; }
.title { font: 600 17px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
.sub { font: 400 12.5px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #59636e; }
.axis { font: 400 12px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #59636e; }
.lbl { font: 600 12.5px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
.val { font: 700 13px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #1f2328; }
.small { font: 400 10.5px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #59636e; }
.grid { stroke: #d1d9e0; stroke-width: 1; }
.axisline { stroke: #59636e; stroke-width: 1; }
.m1 { fill: #1f6feb; } .m2 { fill: #bf8700; } .m3 { fill: #cf222e; }
.m1c { fill: #a5c9ff; } .m2c { fill: #e8c477; } .m3c { fill: #ffb3ba; }
.medmark { stroke: #1f2328; stroke-width: 2; stroke-dasharray: 3 2; }
.good { font: 700 12px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #1a7f37; }
.goodsm { font: 700 10px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #1a7f37; }
.bad { font: 700 12px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #a40e26; }
.badsm { font: 700 10px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #a40e26; }
.base { font: 400 11px ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; fill: #59636e; }
@media (prefers-color-scheme: dark) {
  .bg { fill: #0d1117; }
  .title, .lbl, .val { fill: #e6edf3; }
  .sub, .axis, .small, .base { fill: #9198a1; }
  .grid { stroke: #2f3742; }
  .axisline { stroke: #9198a1; }
  .m1 { fill: #58a6ff; } .m2 { fill: #d29922; } .m3 { fill: #f85149; }
  .m1c { fill: #1f4e85; } .m2c { fill: #6b4c08; } .m3c { fill: #7d2622; }
  .medmark { stroke: #e6edf3; }
  .good, .goodsm { fill: #3fb950; }
  .bad, .badsm { fill: #ff7b72; }
}</style>
